<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2F3A"/>
      <stop offset="1" stop-color="#0E1015"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#34C759"/>
      <stop offset="0.55" stop-color="#30D0C8"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
    <!-- track: 270° gauge opening at the bottom -->
    <path d="M 727.3 393.6 A 242.5 242.5 0 0 1 683.5 683.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="64" stroke-linecap="round"/>
    <!-- remaining: ~72% of the gauge -->
    <path d="M 340.5 683.5 A 242.5 242.5 0 1 1 727.3 393.6" fill="none" stroke="url(#arc)" stroke-width="64" stroke-linecap="round"/>
    <!-- needle hub -->
    <circle cx="512" cy="512" r="46" fill="#FFFFFF" fill-opacity="0.92"/>
    <path d="M 512 512 L 660 427" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="30" stroke-linecap="round"/>
    <rect x="100.5" y="100.5" width="823" height="823" rx="185" ry="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
  </g>
</svg>
