name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite headers
        run: |
          echo "--- resolv.conf"; cat /etc/resolv.conf || true
          echo "--- getent"; getent hosts github.com archive.ubuntu.com security.ubuntu.com || true
          echo "--- ahostsv4"; getent ahostsv4 archive.ubuntu.com || true
          apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev
      - name: Build
        run: swift build
      - name: Test
        run: swift test
