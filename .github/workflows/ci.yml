name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    container:
      image: swift:6.1
      # Names stopped resolving inside the job container on runner image
      # 20261101; give Docker's resolver public upstreams.
      options: --dns 1.1.1.1 --dns 8.8.8.8
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite headers
        run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev
      - name: Build
        run: swift build
      - name: Test
        run: swift test
